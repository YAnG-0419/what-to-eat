<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f6ff">
  <meta name="description" content="厘清智能饭区选择入口。">
  <title>选择饭区 · 今天吃什么</title>
  <style>
    :root {
      --ink: #22253d;
      --muted: #737c99;
      --line: rgba(94, 92, 166, .15);
      --shadow: 0 26px 70px rgba(90, 75, 151, .15);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: #f8f6ff; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        linear-gradient(rgba(94,92,166,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(94,92,166,.04) 1px, transparent 1px),
        radial-gradient(circle at 8% 2%, rgba(114,174,255,.38), transparent 30rem),
        radial-gradient(circle at 92% 35%, rgba(189,139,255,.25), transparent 28rem),
        radial-gradient(circle at 58% 95%, rgba(255,160,199,.24), transparent 30rem),
        #f8f6ff;
      background-size: 36px 36px, 36px 36px, auto, auto, auto, auto;
    }

    .shell {
      width: min(100% - 28px, 820px);
      margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) 0 max(40px, env(safe-area-inset-bottom));
    }

    .topbar { display: flex; align-items: center; }

    .brand-lockup { display: inline-flex; align-items: center; gap: 11px; color: inherit; text-decoration: none; }
    .brand-mark { width: 43px; height: 43px; object-fit: contain; image-rendering: pixelated; flex: 0 0 auto; }
    .brand-copy { display: flex; flex-direction: column; align-items: flex-start; }

    .wordmark {
      display: block;
      color: #11172a;
      font-size: clamp(29px, 6vw, 42px);
      font-weight: 950;
      letter-spacing: -.075em;
      line-height: 1;
    }

    .wordmark span { color: #6676e8; }
    .signature { margin-top: 6px; color: #777e98; font-family: Georgia, "Times New Roman", serif; font-size: 11px; font-style: italic; letter-spacing: .035em; }

    .hero { padding: clamp(62px, 11vw, 96px) 0 42px; text-align: center; }

    h1 {
      margin: 0;
      font-size: clamp(46px, 11vw, 78px);
      line-height: .98;
      letter-spacing: -.06em;
      background: linear-gradient(110deg, #315aaf, #7661d9 52%, #df5da7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .location-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .location {
      position: relative;
      min-height: 240px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--line);
      border-radius: 30px;
      color: var(--ink);
      background: rgba(255,255,255,.72);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      text-decoration: none;
      overflow: hidden;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .location:hover { transform: translateY(-5px); box-shadow: 0 32px 76px rgba(90,75,151,.2); }

    .location::before {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      right: -54px;
      top: -58px;
      border-radius: 50%;
      opacity: .9;
    }

    .wudaokou::before { background: radial-gradient(circle, rgba(127,160,255,.42), rgba(194,153,255,.12) 62%, transparent 68%); }
    .xinzhongguan::before { background: radial-gradient(circle, rgba(255,188,112,.5), rgba(255,143,125,.12) 62%, transparent 68%); }

    .card-top, .card-bottom { position: relative; z-index: 1; }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .1em;
    }

    .wudaokou .tag { color: #586ad0; background: rgba(109,129,232,.11); }
    .xinzhongguan .tag { color: #bd6c3d; background: rgba(255,167,105,.14); }

    .pin { margin-top: 28px; font-size: 42px; filter: drop-shadow(0 8px 16px rgba(73,66,124,.13)); }
    .location h2 { margin: 0 0 8px; font-size: clamp(30px, 7vw, 44px); letter-spacing: -.045em; }

    .enter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      font-weight: 850;
    }

    .wudaokou .enter { color: #6570cf; }
    .xinzhongguan .enter { color: #c56f41; }
    .arrow { font-size: 20px; transition: transform .2s ease; }
    .location:hover .arrow { transform: translateX(5px); }

    @media (max-width: 620px) {
      .hero { padding: 64px 0 32px; text-align: left; }
      .location-grid { grid-template-columns: 1fr; }
      .location { min-height: 210px; }
    }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand-lockup" href="index.html" aria-label="厘清智能首页">
        <img class="brand-mark" src="assets/liqing-mark.png" alt="">
        <span class="brand-copy"><span class="wordmark">厘清<span>智能</span></span><span class="signature">Let Delicious Flow.</span></span>
      </a>
    </header>

    <section class="hero">
      <h1>今天去哪儿吃？</h1>
    </section>

    <section class="location-grid" aria-label="选择饭区">
      <a class="location wudaokou" href="wudaokou.html">
        <div class="card-top">
          <span class="tag">● 已上线 · 18 个选择</span>
          <div class="pin" aria-hidden="true">⌖</div>
        </div>
        <div class="card-bottom">
          <h2>五道口</h2>
          <div class="enter"><span>进入五道口</span><span class="arrow">→</span></div>
        </div>
      </a>

      <a class="location xinzhongguan" href="xinzhongguan.html">
        <div class="card-top">
          <span class="tag">● 已上线 · 7 个选择</span>
          <div class="pin" aria-hidden="true">⌖</div>
        </div>
        <div class="card-bottom">
          <h2>新中关</h2>
          <div class="enter"><span>进入新中关</span><span class="arrow">→</span></div>
        </div>
      </a>
    </section>
  </main>
</body>
</html>
